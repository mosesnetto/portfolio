<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Modbus AWS Logger architecture preview</title>
  <desc id="desc">An industrial telemetry diagram showing PLC data moving through a Raspberry Pi edge gateway over MQTT and TLS into AWS IoT Core.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#081522"/><stop offset=".55" stop-color="#0b2130"/><stop offset="1" stop-color="#111b2d"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fb923c"/><stop offset="1" stop-color="#f59e0b"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#67e8f9"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#bae6fd" stroke-opacity=".055"/></pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#67e8f9"/></marker>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="720" rx="28" fill="url(#grid)"/>
  <circle cx="110" cy="90" r="150" fill="#f59e0b" opacity=".07" filter="url(#glow)"/>
  <circle cx="1080" cy="620" r="180" fill="#22d3ee" opacity=".07" filter="url(#glow)"/>
  <rect x="28" y="26" width="1144" height="668" rx="20" fill="#081a27" stroke="#285064"/>
  <rect x="28" y="26" width="1144" height="66" rx="20" fill="#0d2433"/>
  <path d="M28 72h1144" stroke="#285064"/>
  <rect x="52" y="44" width="30" height="30" rx="9" fill="url(#orange)"/>
  <path d="M60 60h14M63 56v-7h8v7M61 60v-5h12v5" fill="none" stroke="#3b1d08" stroke-width="2" stroke-linecap="round"/>
  <text x="96" y="57" fill="#e0f2fe" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.2">MODBUS AWS LOGGER</text>
  <text x="96" y="75" fill="#7dd3fc" font-family="Arial, sans-serif" font-size="10" letter-spacing="2.2">INDUSTRIAL TELEMETRY BRIDGE</text>
  <rect x="923" y="43" width="124" height="27" rx="13.5" fill="#123b45" stroke="#2dd4bf" stroke-opacity=".55"/>
  <circle cx="941" cy="56.5" r="4" fill="#5eead4"/><text x="953" y="60" fill="#a7f3d0" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1">EDGE ONLINE</text>
  <text x="1142" y="61" fill="#64748b" font-family="Arial, sans-serif" font-size="10" text-anchor="end">ARCHITECTURE PREVIEW</text>

  <text x="56" y="126" fill="#7dd3fc" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.8">REFERENCE DEPLOYMENT / EDGE → CLOUD</text>
  <text x="56" y="156" fill="#e0f2fe" font-family="Arial, sans-serif" font-size="25" font-weight="700">PLC data, made useful.</text>
  <text x="56" y="181" fill="#64748b" font-family="Arial, sans-serif" font-size="12">Configuration → read → validate → publish</text>

  <!-- PLC -->
  <rect x="56" y="224" width="272" height="270" rx="18" fill="#102838" stroke="#3a6375"/>
  <text x="80" y="257" fill="#fbbf24" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.6">01 / PLC INPUT</text>
  <rect x="80" y="280" width="224" height="126" rx="12" fill="#0a1b27" stroke="#285064"/>
  <rect x="102" y="302" width="180" height="78" rx="8" fill="#142f3d"/>
  <path d="M118 321h148M118 337h148M118 353h100" stroke="#2b7184" stroke-width="3" stroke-linecap="round"/>
  <circle cx="260" cy="319" r="5" fill="#fbbf24" filter="url(#glow)"/><circle cx="260" cy="337" r="5" fill="#fbbf24"/><circle cx="260" cy="355" r="5" fill="#334155"/>
  <text x="80" y="438" fill="#e2e8f0" font-family="Arial, sans-serif" font-size="14" font-weight="700">Omron + Siemens PLCs</text>
  <text x="80" y="459" fill="#64748b" font-family="Arial, sans-serif" font-size="11">Holding registers / 900+ tags</text>
  <rect x="80" y="470" width="224" height="2" fill="#285064"/>

  <!-- Edge -->
  <path d="M342 359h74" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="379" y="338" fill="#67e8f9" font-family="Consolas, monospace" font-size="10" text-anchor="middle">MODBUS TCP</text>
  <rect x="432" y="204" width="322" height="310" rx="18" fill="#102a39" stroke="#2dd4bf" stroke-opacity=".65"/>
  <text x="456" y="237" fill="#5eead4" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.6">02 / EDGE GATEWAY</text>
  <rect x="456" y="260" width="274" height="120" rx="14" fill="#0a1b27" stroke="#2a5a67"/>
  <rect x="486" y="284" width="92" height="72" rx="8" fill="#123d4a" stroke="#2dd4bf"/>
  <circle cx="508" cy="310" r="5" fill="#5eead4"/><circle cx="532" cy="310" r="5" fill="#fbbf24"/><circle cx="556" cy="310" r="5" fill="#38bdf8"/>
  <path d="M508 326h48M508 338h36" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round"/>
  <text x="600" y="292" fill="#e0f2fe" font-family="Arial, sans-serif" font-size="15" font-weight="700">Raspberry Pi 5</text>
  <text x="600" y="314" fill="#7dd3fc" font-family="Arial, sans-serif" font-size="11">decode · timestamp</text>
  <text x="600" y="332" fill="#7dd3fc" font-family="Arial, sans-serif" font-size="11">retry · validate</text>
  <rect x="456" y="402" width="126" height="38" rx="9" fill="#123b45"/><text x="476" y="426" fill="#a7f3d0" font-family="Arial, sans-serif" font-size="10" font-weight="700">JSON PAYLOAD</text>
  <rect x="596" y="402" width="134" height="38" rx="9" fill="#3a2a13"/><text x="616" y="426" fill="#fde68a" font-family="Arial, sans-serif" font-size="10" font-weight="700">NO SECRETS IN GIT</text>
  <rect x="456" y="458" width="274" height="28" rx="8" fill="#0a1b27" stroke="#285064"/>
  <circle cx="474" cy="472" r="4" fill="#5eead4"/><text x="486" y="476" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="10">reconnect handling enabled</text>
  <path d="M754 359h74" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="791" y="338" fill="#67e8f9" font-family="Consolas, monospace" font-size="10" text-anchor="middle">MQTT / TLS</text>

  <!-- Cloud -->
  <rect x="844" y="224" width="300" height="270" rx="18" fill="#102838" stroke="#3a6375"/>
  <text x="868" y="257" fill="#38bdf8" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.6">03 / CLOUD</text>
  <path d="M900 326c0-28 23-51 51-51 10 0 20 3 28 9 9-16 26-27 46-27 29 0 52 23 52 52 0 4 0 8-1 12 18 7 30 24 30 44 0 26-21 47-47 47H919c-27 0-49-22-49-49 0-19 11-36 30-43-1-2-1-3 0-5Z" fill="#123b4b" stroke="#38bdf8" stroke-width="2"/>
  <text x="933" y="350" fill="#bae6fd" font-family="Arial, sans-serif" font-size="18" font-weight="700">AWS IoT Core</text>
  <text x="933" y="373" fill="#7dd3fc" font-family="Arial, sans-serif" font-size="11">structured telemetry / QoS 1</text>
  <rect x="868" y="410" width="252" height="38" rx="9" fill="#0a1b27" stroke="#285064"/>
  <text x="886" y="434" fill="#a7f3d0" font-family="Consolas, monospace" font-size="10">{ "machine": "Machine_1", ... }</text>
  <rect x="868" y="460" width="252" height="2" fill="#285064"/>

  <rect x="56" y="560" width="1088" height="96" rx="16" fill="#0a1b27" stroke="#23485b"/>
  <text x="82" y="591" fill="#7dd3fc" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.6">BUILT-IN GUARDRAILS</text>
  <g font-family="Arial, sans-serif" font-size="12" fill="#cbd5e1">
    <circle cx="86" cy="621" r="5" fill="#5eead4"/><text x="100" y="625">900+ tags</text>
    <circle cx="250" cy="621" r="5" fill="#38bdf8"/><text x="264" y="625">MQTT / TLS</text>
    <circle cx="424" cy="621" r="5" fill="#fbbf24"/><text x="438" y="625">offline demo mode</text>
    <circle cx="646" cy="621" r="5" fill="#a78bfa"/><text x="660" y="625">reconnect + validation</text>
    <circle cx="904" cy="621" r="5" fill="#fb7185"/><text x="918" y="625">secrets stay local</text>
  </g>
</svg>
