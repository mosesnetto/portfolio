<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">MCC Machine Shift Monitor operations preview</title>
  <desc id="desc">An operations dashboard preview showing a manufacturing machine, shift timeline, Telegram alert, and 4G call escalation.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0a1424"/><stop offset=".55" stop-color="#101b32"/><stop offset="1" stop-color="#17152a"/></linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fb7185"/><stop offset="1" stop-color="#ef4444"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#5eead4"/><stop offset="1" stop-color="#34d399"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#c4b5fd" stroke-opacity=".05"/></pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="720" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="720" rx="28" fill="url(#grid)"/>
  <circle cx="1030" cy="100" r="160" fill="#fb7185" opacity=".07" filter="url(#glow)"/>
  <circle cx="170" cy="620" r="170" fill="#5eead4" opacity=".05" filter="url(#glow)"/>
  <rect x="28" y="26" width="1144" height="668" rx="20" fill="#0c1729" stroke="#293a59"/>
  <rect x="28" y="26" width="1144" height="66" rx="20" fill="#111d34"/>
  <path d="M28 72h1144" stroke="#293a59"/>
  <rect x="52" y="44" width="30" height="30" rx="9" fill="url(#red)"/>
  <path d="M60 59h14M67 52v14" stroke="#4c0519" stroke-width="3" stroke-linecap="round"/>
  <text x="96" y="57" fill="#e0e7ff" font-family="Arial, sans-serif" font-size="16" font-weight="700" letter-spacing="1.1">MCC MACHINE SHIFT MONITOR</text>
  <text x="96" y="75" fill="#c4b5fd" font-family="Arial, sans-serif" font-size="10" letter-spacing="2.1">RASPBERRY PI 5 / OPERATIONS</text>
  <rect x="916" y="43" width="130" height="27" rx="13.5" fill="#4c1d2a" stroke="#fb7185" stroke-opacity=".7"/>
  <circle cx="934" cy="56.5" r="4" fill="#fb7185" filter="url(#glow)"/><text x="946" y="60" fill="#fecdd3" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1">SHIFT 2 / LIVE</text>
  <text x="1142" y="61" fill="#64748b" font-family="Arial, sans-serif" font-size="10" text-anchor="end">OPERATIONS PREVIEW</text>

  <text x="56" y="126" fill="#c4b5fd" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.8">LIVE LINE MONITOR / MCC-01</text>
  <text x="56" y="158" fill="#e0e7ff" font-family="Arial, sans-serif" font-size="25" font-weight="700">From breakdown to escalation.</text>
  <text x="56" y="183" fill="#64748b" font-family="Arial, sans-serif" font-size="12">Poll status · detect shift · alert · call</text>

  <!-- machine card -->
  <rect x="56" y="218" width="340" height="318" rx="18" fill="#131f36" stroke="#334466"/>
  <text x="80" y="252" fill="#c4b5fd" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.6">MACHINE STATUS</text>
  <rect x="80" y="276" width="292" height="128" rx="13" fill="#0b1426" stroke="#334466"/>
  <circle cx="130" cy="328" r="38" fill="#3b1728" stroke="#fb7185" stroke-width="2"/>
  <circle cx="130" cy="328" r="25" fill="#1b233b" stroke="#fb7185" stroke-opacity=".6"/>
  <path d="M130 301v54M103 328h54" stroke="#fb7185" stroke-width="4" stroke-linecap="round"/>
  <text x="190" y="316" fill="#fecdd3" font-family="Arial, sans-serif" font-size="22" font-weight="800">DOWN</text>
  <text x="190" y="339" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11">last poll 14:32:08 IST</text>
  <rect x="190" y="356" width="124" height="24" rx="12" fill="#4c1d2a"/><text x="252" y="372" fill="#fecdd3" font-family="Arial, sans-serif" font-size="10" font-weight="700" text-anchor="middle">BREAKDOWN ACTIVE</text>
  <path d="M80 432h292" stroke="#334466"/>
  <text x="80" y="459" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11">Downtime threshold</text>
  <text x="350" y="459" fill="#fb7185" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="end">10 min → alert</text>
  <text x="80" y="488" fill="#94a3b8" font-family="Arial, sans-serif" font-size="11">Escalation threshold</text>
  <text x="350" y="488" fill="#fbbf24" font-family="Arial, sans-serif" font-size="13" font-weight="700" text-anchor="end">30 min → call</text>
  <rect x="80" y="505" width="292" height="8" rx="4" fill="#293653"/><rect x="80" y="505" width="192" height="8" rx="4" fill="url(#red)"/>

  <!-- timeline -->
  <rect x="420" y="218" width="724" height="318" rx="18" fill="#131f36" stroke="#334466"/>
  <text x="444" y="252" fill="#c4b5fd" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.6">SHIFT-AWARE EVENT TIMELINE</text>
  <text x="1120" y="252" fill="#64748b" font-family="Arial, sans-serif" font-size="10" text-anchor="end">IST / 24 HOUR CLOCK</text>
  <g stroke="#334466" stroke-width="1"><path d="M462 300v142M548 300v142M634 300v142M720 300v142M806 300v142M892 300v142M978 300v142M1064 300v142"/></g>
  <rect x="462" y="300" width="86" height="142" rx="8" fill="#153f42" opacity=".8"/><rect x="548" y="300" width="86" height="142" rx="8" fill="#3b2c16" opacity=".8"/><rect x="634" y="300" width="86" height="142" rx="8" fill="#1f254b" opacity=".8"/><rect x="720" y="300" width="86" height="142" rx="8" fill="#3b1d2a" opacity=".85"/><rect x="806" y="300" width="86" height="142" rx="8" fill="#153f42" opacity=".8"/><rect x="892" y="300" width="86" height="142" rx="8" fill="#3b2c16" opacity=".8"/><rect x="978" y="300" width="86" height="142" rx="8" fill="#1f254b" opacity=".8"/>
  <g fill="#94a3b8" font-family="Arial, sans-serif" font-size="9" text-anchor="middle"><text x="505" y="320">06</text><text x="591" y="320">08</text><text x="677" y="320">10</text><text x="763" y="320">12</text><text x="849" y="320">14</text><text x="935" y="320">16</text><text x="1021" y="320">18</text></g>
  <g font-family="Arial, sans-serif" font-size="9" text-anchor="middle"><text x="505" y="466" fill="#86efac">SHIFT 1</text><text x="591" y="466" fill="#fcd34d">SHIFT 1</text><text x="677" y="466" fill="#a5b4fc">SHIFT 2</text><text x="763" y="466" fill="#fda4af">ALERT</text><text x="849" y="466" fill="#86efac">SHIFT 2</text><text x="935" y="466" fill="#fcd34d">SHIFT 2</text><text x="1021" y="466" fill="#a5b4fc">SHIFT 3</text></g>
  <path d="M460 392H1080" stroke="#fb7185" stroke-width="3" stroke-dasharray="5 6" opacity=".8"/>
  <circle cx="849" cy="392" r="7" fill="#fb7185" filter="url(#glow)"/><rect x="808" y="348" width="82" height="24" rx="12" fill="#4c1d2a"/><text x="849" y="364" fill="#fecdd3" font-family="Arial, sans-serif" font-size="9" font-weight="700" text-anchor="middle">14:32 DOWN</text>
  <text x="444" y="500" fill="#64748b" font-family="Arial, sans-serif" font-size="10">Automatic shift detection uses IST and keeps alert timing predictable.</text>

  <!-- notifications -->
  <rect x="56" y="568" width="1088" height="98" rx="16" fill="#0b1426" stroke="#334466"/>
  <text x="82" y="598" fill="#c4b5fd" font-family="Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="1.6">NOTIFICATION ROUTE</text>
  <g font-family="Arial, sans-serif" font-size="11">
    <rect x="82" y="614" width="244" height="32" rx="9" fill="#152f45" stroke="#38bdf8"/><circle cx="100" cy="630" r="5" fill="#38bdf8"/><text x="114" y="634" fill="#bae6fd">Telegram alert</text>
    <path d="M342 630h38" stroke="#64748b" stroke-width="2"/><path d="m374 624 7 6-7 6" fill="none" stroke="#64748b" stroke-width="2"/>
    <rect x="398" y="614" width="244" height="32" rx="9" fill="#3b2c16" stroke="#fbbf24"/><circle cx="416" cy="630" r="5" fill="#fbbf24"/><text x="430" y="634" fill="#fde68a">Voice briefing</text>
    <path d="M658 630h38" stroke="#64748b" stroke-width="2"/><path d="m690 624 7 6-7 6" fill="none" stroke="#64748b" stroke-width="2"/>
    <rect x="714" y="614" width="300" height="32" rx="9" fill="#4c1d2a" stroke="#fb7185"/><circle cx="732" cy="630" r="5" fill="#fb7185"/><text x="746" y="634" fill="#fecdd3">4G call escalation / A7670E</text>
  </g>
</svg>
